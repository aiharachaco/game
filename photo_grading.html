<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Photo Grading</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0f;
  --surface:#1a1a1f;
  --surface2:#25252d;
  --accent:#a8b8c8;
  --text:#eceef0;
  --text2:#6a6e74;
  --radius:14px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
}
header{
  padding:18px 20px 12px;
  display:flex;
  align-items:baseline;
  gap:10px;
}
header h1{
  font-size:1rem;
  font-weight:400;
  letter-spacing:.18em;
  color:var(--text2);
}
header .title-accent{
  color:var(--accent);
  font-weight:600;
  letter-spacing:.1em;
}

/* Canvas / Preview */
.canvas-wrap{
  position:relative;
  width:100%;
  background:#000;
  overflow:hidden;
}
.canvas-wrap canvas{
  width:100%;
  display:block;
}
.placeholder{
  aspect-ratio:4/5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:var(--surface);
}
.placeholder svg{opacity:.25;}
.placeholder p{
  color:var(--text2);
  font-size:.8rem;
  letter-spacing:.08em;
}

/* Buttons */
.btn-row{
  display:flex;
  gap:8px;
  padding:14px 16px 0;
}
.btn{
  flex:1;
  padding:13px 8px;
  border:none;
  border-radius:var(--radius);
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.08em;
  cursor:pointer;
  transition:opacity .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.95);opacity:.75}
.btn-gallery{background:var(--surface2);color:var(--text);}
.btn-camera{
  background:var(--accent);
  color:#0a0f14;
  flex:1.4;
}
.btn-download{
  background:transparent;
  color:var(--accent);
  border:1px solid var(--surface2);
  display:none;
}
.btn-download.visible{display:flex;}

/* Reset link */
.reset-row{
  display:flex;
  justify-content:flex-end;
  padding:14px 18px 0;
}
.reset-btn{
  background:none;
  border:none;
  color:var(--text2);
  font-size:.7rem;
  letter-spacing:.06em;
  cursor:pointer;
  padding:4px 0;
  text-decoration:underline;
  text-underline-offset:3px;
}

/* Section label */
.section-label{
  padding:16px 16px 8px;
  font-size:.65rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--text2);
  font-weight:500;
}

/* Sliders */
.sliders{
  padding:0 16px 16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.slider-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.slider-label{
  width:70px;
  font-size:.7rem;
  color:var(--text2);
  letter-spacing:.04em;
  flex-shrink:0;
}
.slider-val{
  width:28px;
  text-align:right;
  font-size:.7rem;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
  flex-shrink:0;
}
input[type=range]{
  flex:1;
  -webkit-appearance:none;
  appearance:none;
  height:2px;
  border-radius:2px;
  background:var(--surface2);
  outline:none;
  cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;height:16px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 5px rgba(168,184,200,.4);
  cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;
  border-radius:50%;
  background:var(--accent);
  border:none;
  cursor:pointer;
}

/* Compare overlay */
.compare-btn{
  position:absolute;
  bottom:12px;right:12px;
  background:rgba(0,0,0,.5);
  color:rgba(255,255,255,.85);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:6px 13px;
  font-size:.68rem;
  letter-spacing:.08em;
  cursor:pointer;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:none;
  user-select:none;
}
.compare-btn.visible{display:block}
.compare-label{
  position:absolute;
  top:12px;left:12px;
  background:rgba(0,0,0,.45);
  color:rgba(255,255,255,.7);
  border-radius:6px;
  padding:4px 9px;
  font-size:.62rem;
  letter-spacing:.1em;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:none;
}
.compare-label.visible{display:block}

.spacer{height:env(safe-area-inset-bottom,20px);min-height:20px;}
#fileInput,#cameraInput{display:none}
</style>
</head>
<body>

<header>
  <h1><span class="title-accent">HAKANAI</span></h1>
</header>

<div class="canvas-wrap" id="previewWrap">
  <canvas id="mainCanvas"></canvas>
  <div class="placeholder" id="placeholder">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <rect x="2" y="3" width="20" height="18" rx="2"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="18.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
    </svg>
    <p>写真を読み込む</p>
  </div>
  <button class="compare-btn" id="compareBtn">押している間 比較</button>
  <div class="compare-label" id="compareLabel">ORIGINAL</div>
</div>

<div class="btn-row">
  <button class="btn btn-gallery" id="galleryBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="m21 15-5-5L5 21"/>
    </svg>
    ギャラリー
  </button>
  <button class="btn btn-camera" id="cameraBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3"/>
    </svg>
    カメラ
  </button>
  <button class="btn btn-download" id="downloadBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    保存
  </button>
</div>

<div class="reset-row">
  <button class="reset-btn" id="resetBtn">デフォルトに戻す</button>
</div>

<div class="section-label">調整</div>
<div class="sliders">
  <div class="slider-row">
    <span class="slider-label">明るさ</span>
    <input type="range" id="s_brightness" min="-100" max="100" value="5">
    <span class="slider-val" id="v_brightness">5</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">コントラスト</span>
    <input type="range" id="s_contrast" min="-100" max="100" value="8">
    <span class="slider-val" id="v_contrast">8</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">彩度</span>
    <input type="range" id="s_saturation" min="-100" max="100" value="-22">
    <span class="slider-val" id="v_saturation">-22</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">色温度</span>
    <input type="range" id="s_temperature" min="-100" max="100" value="-18">
    <span class="slider-val" id="v_temperature">-18</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">ティール</span>
    <input type="range" id="s_teal" min="0" max="100" value="18">
    <span class="slider-val" id="v_teal">18</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">フェード</span>
    <input type="range" id="s_fade" min="0" max="100" value="32">
    <span class="slider-val" id="v_fade">32</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">シャープ</span>
    <input type="range" id="s_sharpen" min="0" max="100" value="8">
    <span class="slider-val" id="v_sharpen">8</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">ビネット</span>
    <input type="range" id="s_vignette" min="0" max="100" value="22">
    <span class="slider-val" id="v_vignette">22</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">グレイン</span>
    <input type="range" id="s_grain" min="0" max="100" value="14">
    <span class="slider-val" id="v_grain">14</span>
  </div>
</div>

<div class="spacer"></div>
<input type="file" id="fileInput" accept="image/*">
<input type="file" id="cameraInput" accept="image/*" capture="environment">

<script>
// Default "儚い" filter values
const DEFAULT_PARAMS = {
  brightness: 5,
  contrast: 8,
  saturation: -22,
  temperature: -18,
  teal: 18,
  fade: 32,
  sharpen: 8,
  vignette: 22,
  grain: 14,
};
const RAW_PARAMS = {
  brightness:0,contrast:0,saturation:0,temperature:0,teal:0,fade:0,sharpen:0,vignette:0,grain:0
};

let originalImg = null;
let currentParams = {...DEFAULT_PARAMS};
let comparing = false;

const mainCanvas = document.getElementById('mainCanvas');
const placeholder = document.getElementById('placeholder');
const downloadBtn = document.getElementById('downloadBtn');
const compareBtn = document.getElementById('compareBtn');
const compareLabel = document.getElementById('compareLabel');

// Slider wiring
const sliderNames = ['brightness','contrast','saturation','temperature','teal','fade','sharpen','vignette','grain'];
const sliders = {};
sliderNames.forEach(n => {
  const s = document.getElementById('s_'+n);
  const v = document.getElementById('v_'+n);
  sliders[n] = {el:s, valEl:v};
  s.addEventListener('input', () => {
    currentParams[n] = parseInt(s.value);
    v.textContent = s.value;
    scheduleRender();
  });
});

// Reset to defaults
document.getElementById('resetBtn').addEventListener('click', () => {
  currentParams = {...DEFAULT_PARAMS};
  sliderNames.forEach(n => {
    sliders[n].el.value = currentParams[n];
    sliders[n].valEl.textContent = currentParams[n];
  });
  scheduleRender();
});

// File/camera loading
function loadImage(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      originalImg = img;
      placeholder.style.display = 'none';
      compareBtn.classList.add('visible');
      downloadBtn.classList.add('visible');
      scheduleRender();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('galleryBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('cameraBtn').addEventListener('click', () => document.getElementById('cameraInput').click());
document.getElementById('fileInput').addEventListener('change', e => { if(e.target.files[0]) loadImage(e.target.files[0]); });
document.getElementById('cameraInput').addEventListener('change', e => { if(e.target.files[0]) loadImage(e.target.files[0]); });

// Compare (hold to see original)
compareBtn.addEventListener('pointerdown', () => { comparing=true;  compareLabel.classList.add('visible');    scheduleRender(); });
compareBtn.addEventListener('pointerup',   () => { comparing=false; compareLabel.classList.remove('visible'); scheduleRender(); });
compareBtn.addEventListener('pointerleave',() => { if(comparing){ comparing=false; compareLabel.classList.remove('visible'); scheduleRender(); } });

// Download — render full-res without square crop
document.getElementById('downloadBtn').addEventListener('click', () => {
  if(!originalImg) return;
  const out = document.createElement('canvas');
  out.width  = originalImg.naturalWidth;
  out.height = originalImg.naturalHeight;
  drawGraded(originalImg, currentParams, out, true);
  setTimeout(() => {
    const a = document.createElement('a');
    a.download = 'hakanai_'+Date.now()+'.jpg';
    a.href = out.toDataURL('image/jpeg', 0.95);
    a.click();
  }, 80);
});

// Render loop
let rafId = null;
function scheduleRender() {
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => {
    rafId = null;
    if(!originalImg) return;
    drawGraded(originalImg, comparing ? RAW_PARAMS : currentParams, mainCanvas);
  });
}

// ── Core grading engine ────────────────────────────────────────────────────
function drawGraded(img, params, target, fullRes=false) {
  const srcW = img.naturalWidth, srcH = img.naturalHeight;
  let sx, sy, sw, sh, cw, ch;

  if(!fullRes && target === mainCanvas) {
    // 4:5 portrait crop from center for preview
    const aspect = 4/5;
    if(srcW/srcH > aspect){
      sh = srcH; sw = srcH*aspect;
      sx = (srcW-sw)/2; sy = 0;
    } else {
      sw = srcW; sh = srcW/aspect;
      sx = 0; sy = (srcH-sh)/2;
    }
    const maxW = 720;
    cw = Math.min(sw, maxW);
    ch = Math.round(cw / aspect);
  } else {
    sx=0; sy=0; sw=srcW; sh=srcH; cw=srcW; ch=srcH;
  }

  target.width = cw; target.height = ch;
  const tc = target.getContext('2d', {willReadFrequently:true});
  tc.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);

  const imageData = tc.getImageData(0, 0, cw, ch);
  const data = imageData.data;
  const {brightness,contrast,saturation,temperature,teal,fade,sharpen,vignette,grain} = params;

  const lut = buildLUT(brightness, contrast, saturation, temperature, fade);

  for(let i=0; i<data.length; i+=4){
    let r = lut.r[data[i]];
    let g = lut.g[data[i+1]];
    let b = lut.b[data[i+2]];

    // Teal-orange split tone: shadows→teal, highlights→warm
    if(teal > 0){
      const t = teal/100;
      const lum = (r*0.299 + g*0.587 + b*0.114) / 255;
      const shadow  = Math.max(0, 1 - lum * 2.2);
      const hilight = Math.max(0, lum * 2.2 - 1.2);
      r = clamp(r + (hilight*22 - shadow*12) * t);
      g = clamp(g + (hilight*6  - shadow*4 ) * t);
      b = clamp(b - (hilight*18 - shadow*28) * t);
    }

    data[i]=r; data[i+1]=g; data[i+2]=b;
  }

  // Grain (luminance-weighted for natural feel)
  if(grain > 0){
    const gAmt = grain/100 * 40;
    for(let i=0; i<data.length; i+=4){
      const n = (Math.random()-.5) * gAmt;
      data[i]   = clamp(data[i]   + n);
      data[i+1] = clamp(data[i+1] + n);
      data[i+2] = clamp(data[i+2] + n);
    }
  }

  tc.putImageData(imageData, 0, 0);

  if(sharpen > 0 && cw > 100) applyUnsharpMask(tc, cw, ch, sharpen);

  if(vignette > 0){
    const v = vignette/100;
    // Elongated vignette matching portrait aspect
    const gx = tc.createRadialGradient(cw*.5, ch*.5, Math.min(cw,ch)*0.3,
                                        cw*.5, ch*.5, Math.max(cw,ch)*0.82);
    gx.addColorStop(0, 'rgba(0,0,0,0)');
    gx.addColorStop(1, `rgba(0,0,0,${v*0.72})`);
    tc.fillStyle = gx;
    tc.fillRect(0,0,cw,ch);
  }
}

// ── LUT builder ───────────────────────────────────────────────────────────
function buildLUT(brightness, contrast, saturation, temperature, fade){
  const rLUT = new Uint8ClampedArray(256);
  const gLUT = new Uint8ClampedArray(256);
  const bLUT = new Uint8ClampedArray(256);
  const bri = brightness/100;
  const con = contrast/100;
  const sat = saturation/100;
  const tmp = temperature/100;
  const fd  = fade/100;

  for(let i=0; i<256; i++){
    let r=i, g=i, b=i;

    r += bri*80; g += bri*80; b += bri*80;

    r = applyContrast(r,con);
    g = applyContrast(g,con);
    b = applyContrast(b,con);

    if(sat !== 0){
      const lum = r*0.299 + g*0.587 + b*0.114;
      r = lum + (r-lum)*(1+sat);
      g = lum + (g-lum)*(1+sat);
      b = lum + (b-lum)*(1+sat);
    }

    // Color temperature
    if(tmp > 0){ r += tmp*38; g += tmp*12; b -= tmp*28; }
    else        { r += tmp*22; g += tmp*5;  b -= tmp*36; }

    // Fade: lift shadows, add slight blue cast in blacks (film-like)
    if(fd > 0){
      r = r*(1-fd*0.55) + fd*38;
      g = g*(1-fd*0.55) + fd*38;
      b = b*(1-fd*0.55) + fd*46;
    }

    rLUT[i] = clamp(r);
    gLUT[i] = clamp(g);
    bLUT[i] = clamp(b);
  }
  return {r:rLUT, g:gLUT, b:bLUT};
}

function applyContrast(v, con){
  return con >= 0
    ? 128 + (v-128) * (1 + con*1.4)
    : 128 + (v-128) * (1 + con*0.8);
}

// ── Unsharp mask ──────────────────────────────────────────────────────────
function applyUnsharpMask(ctx2d, w, h, amount){
  const strength = amount/100 * 1.1;
  const orig = ctx2d.getImageData(0,0,w,h);
  const blur = new ImageData(new Uint8ClampedArray(orig.data), w, h);
  boxBlur(orig.data, blur.data, w, h, 1);
  const out = ctx2d.createImageData(w, h);
  for(let i=0; i<orig.data.length; i+=4){
    out.data[i]   = clamp(orig.data[i]   + (orig.data[i]  -blur.data[i]  )*strength);
    out.data[i+1] = clamp(orig.data[i+1] + (orig.data[i+1]-blur.data[i+1])*strength);
    out.data[i+2] = clamp(orig.data[i+2] + (orig.data[i+2]-blur.data[i+2])*strength);
    out.data[i+3] = orig.data[i+3];
  }
  ctx2d.putImageData(out, 0, 0);
}

function boxBlur(src, dst, w, h, r){
  const tmp = new Uint8ClampedArray(src.length);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let sR=0,sG=0,sB=0,cnt=0;
      for(let kx=-r;kx<=r;kx++){
        const px=Math.min(Math.max(x+kx,0),w-1);
        const idx=(y*w+px)*4;
        sR+=src[idx];sG+=src[idx+1];sB+=src[idx+2];cnt++;
      }
      const i=(y*w+x)*4;
      tmp[i]=sR/cnt;tmp[i+1]=sG/cnt;tmp[i+2]=sB/cnt;tmp[i+3]=src[i+3];
    }
  }
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let sR=0,sG=0,sB=0,cnt=0;
      for(let ky=-r;ky<=r;ky++){
        const py=Math.min(Math.max(y+ky,0),h-1);
        const idx=(py*w+x)*4;
        sR+=tmp[idx];sG+=tmp[idx+1];sB+=tmp[idx+2];cnt++;
      }
      const i=(y*w+x)*4;
      dst[i]=sR/cnt;dst[i+1]=sG/cnt;dst[i+2]=sB/cnt;dst[i+3]=tmp[i+3];
    }
  }
}

function clamp(v){ return v<0?0:v>255?255:v; }
</script>
</body>
</html>
